<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172a43">
<title>dropnova Chile</title>
<meta name="description" content="Compra en dropnova y paga al recibir. Despacho a todo Chile.">
<style>
:root{--ink:#172a43;--accent:#ef6a54;--muted:#637181;--border:#e7e9ed;--wa:#25d366}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff}
a{color:inherit}
.wrap{width:min(1140px,92%);margin:auto}
header{position:sticky;top:0;background:#fffc;backdrop-filter:blur(18px);z-index:10;border-bottom:1px solid var(--border)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px}
.brand{font-weight:850;letter-spacing:-.8px;font-size:23px;text-decoration:none}
.brand span{color:var(--accent)}
.back{font-size:14px;text-decoration:none;color:var(--muted)}
.button{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:16px 22px;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;font-weight:750;font-size:16px;cursor:pointer;width:100%}
.button:hover{filter:brightness(.96)}
.button.wa{background:var(--wa)}
.button.outline{background:#fff;color:var(--ink);border:1px solid var(--border)}
.button svg{width:22px;height:22px;fill:currentColor}
.product{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;padding:36px 0 20px}
.gallery-main{position:relative;aspect-ratio:1/1;border:1px solid var(--border);border-radius:20px;overflow:hidden;background:#fff;margin:0 auto}
.gallery-main.is-video{aspect-ratio:9/16;width:min(100%,calc(78vh * 9 / 16));background:#000}
.gallery-main img,.gallery-main video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.gallery-main img{background:#fff}
.sound{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:2;background:#000b;color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:750;font-size:14px;cursor:pointer;white-space:nowrap}
.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.thumbs button{width:72px;height:72px;border:2px solid var(--border);border-radius:12px;padding:0;overflow:hidden;background:#fff;cursor:pointer;position:relative}
.thumbs button.active{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .play{position:absolute;inset:0;display:grid;place-items:center;background:#0006;color:#fff;font-size:22px}
.cat{color:#a85b4e;font-weight:800;font-size:14px}
h1{font-size:clamp(28px,4vw,40px);line-height:1.1;letter-spacing:-1px;margin:8px 0 14px}
.price{font-size:38px;font-weight:850;margin:4px 0 6px}
.cod{display:inline-flex;align-items:center;gap:8px;background:#e9f9ef;color:#137a3e;font-weight:750;font-size:14px;padding:8px 14px;border-radius:999px;margin-bottom:18px}
.lead{color:var(--muted);font-size:16px;line-height:1.6;margin:0 0 22px}
.actions{display:grid;gap:10px;margin-bottom:22px}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 6px;padding:0;list-style:none}
.trust li{border:1px solid var(--border);border-radius:14px;padding:12px;font-size:13px;font-weight:650;text-align:center}
.trust span{display:block;font-size:20px;margin-bottom:4px}
section.block{padding:28px 0;border-top:1px solid var(--border)}
h2{font-size:24px;letter-spacing:-.5px;margin:0 0 16px}
.features{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0;padding:0;list-style:none}
.features li{display:flex;gap:10px;align-items:flex-start;background:#f7f8fb;border-radius:14px;padding:14px;font-size:15px;line-height:1.4}
.features li::before{content:"✓";color:#fff;background:var(--accent);border-radius:50%;width:22px;height:22px;flex:0 0 22px;display:grid;place-items:center;font-size:13px;font-weight:800}
details{border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:10px}
summary{font-weight:750;cursor:pointer}
details p{color:var(--muted);margin:10px 0 0;line-height:1.55}
.sticky{display:none}
footer{background:#f7f8fb;padding:28px 0 90px;margin-top:20px;color:var(--muted);font-size:13px}
.state{padding:80px 0;text-align:center;color:var(--muted)}
@media(max-width:820px){
 .product{grid-template-columns:1fr;gap:22px;padding-top:18px}
 .features{grid-template-columns:1fr}
 .gallery-main.is-video{width:min(100%,calc(60vh * 9 / 16))}
 .sticky{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);padding:10px 16px calc(10px + env(safe-area-inset-bottom));gap:12px;align-items:center;z-index:20}
 .sticky .p{font-weight:850;font-size:20px;white-space:nowrap}
 .sticky .button{padding:14px 16px}
}
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="/">drop<span>nova</span></a><a class="back" href="/#catalogo">← Ver todos los productos</a></div></header>
<main class="wrap" id="app"><div class="state">Cargando producto…</div></main>
<footer><div class="wrap">Dropnova · Tienda online en Chile · La Serena. Pago contra entrega y despacho a todo Chile, sujeto a cobertura de la transportadora en tu comuna. Contacto: <a href="mailto:bullkinformatica@gmail.com">bullkinformatica@gmail.com</a> · <a href="/politicas">Políticas de compra</a></div></footer>
<div class="sticky" id="sticky"></div>
<script>
const $=id=>document.getElementById(id);
const clp=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WA_ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2c0 1.3.9 2.5 1 2.7.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>';
const slug=(location.pathname.match(/^\/p\/([a-z0-9-]+)\/?$/)||[])[1]||new URLSearchParams(location.search).get('slug')||'';

function waLink(cfg,p){
  if(!/^56\d{9}$/.test(cfg.whatsapp||''))return null;
  const msg=`Hola dropnova, quiero pedir: ${p.name} (${clp(p.price)}), pago contra entrega. ${location.origin}/p/${p.slug}`;
  return `https://wa.me/${cfg.whatsapp}?text=${encodeURIComponent(msg)}`;
}

function render(p,cfg){
  document.title=`${p.name} | dropnova Chile`;
  const media=[...(p.video?[{type:'video',src:p.video}]:[]),...p.images.map(src=>({type:'img',src}))];
  const wa=waLink(cfg,p);
  const buy=cfg.ordersEnabled
    ? `<a class="button" href="/?add=${encodeURIComponent(p.id)}#pedido">Comprar · Pago contra entrega</a>`
    : '';
  const waBtn=wa?`<a class="button wa" href="${esc(wa)}" target="_blank" rel="noopener">${WA_ICON} Pedir por WhatsApp</a>`:'';
  $('app').innerHTML=`
  <div class="product">
    <div>
      <div class="gallery-main" id="main"></div>
      ${media.length>1?`<div class="thumbs" id="thumbs">${media.map((m,i)=>`<button data-i="${i}" aria-label="Ver ${m.type==='video'?'video':'foto '+(i+1)}">${m.type==='video'?`<img src="${esc(p.images[0]||'')}" alt=""><span class="play">▶</span>`:`<img src="${esc(m.src)}" alt="" loading="lazy">`}</button>`).join('')}</div>`:''}
    </div>
    <div>
      <div class="cat">${esc(p.category)}</div>
      <h1>${esc(p.name)}</h1>
      <div class="price">${clp(p.price)}</div>
      <div class="cod">💵 Paga al recibir · Despacho a todo Chile</div>
      <p class="lead">${esc(p.detail)}</p>
      <div class="actions">${buy}${waBtn}</div>
      <ul class="trust">
        <li><span>💵</span>Pagas al recibir</li>
        <li><span>🚚</span>Envío a todo Chile</li>
        <li><span>💬</span>Atención por WhatsApp</li>
      </ul>
    </div>
  </div>
  ${p.features.length?`<section class="block"><h2>Características</h2><ul class="features">${p.features.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></section>`:''}
  ${p.faq.length?`<section class="block"><h2>Preguntas frecuentes</h2>${p.faq.map(f=>`<details><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join('')}</section>`:''}`;
  const show=i=>{
    const m=media[i]; if(!m){$('main').textContent='📦';return}
    $('main').classList.toggle('is-video',m.type==='video');$('main').innerHTML=m.type==='video'
      ?`<video id="vid" src="${esc(m.src)}" poster="${esc(p.images[0]||'')}" autoplay muted loop playsinline></video><button class="sound" id="sound" type="button">🔊 Activar sonido</button>`
      :`<img src="${esc(m.src)}" alt="${esc(p.name)}">`;
    document.querySelectorAll('#thumbs button').forEach(b=>b.classList.toggle('active',+b.dataset.i===i));
    const v=$('vid'),sb=$('sound');
    if(v&&sb)sb.onclick=()=>{v.muted=!v.muted;if(!v.muted){v.currentTime=0;v.play().catch(()=>{})}sb.textContent=v.muted?'🔊 Activar sonido':'🔇 Silenciar'};
  };
  document.querySelectorAll('#thumbs button').forEach(b=>b.onclick=()=>show(+b.dataset.i));
  show(0);
  const cta=cfg.ordersEnabled?`<a class="button" href="/?add=${encodeURIComponent(p.id)}#pedido">Comprar</a>`:(wa?`<a class="button wa" href="${esc(wa)}" target="_blank" rel="noopener">${WA_ICON} Pedir</a>`:'');
  if(cta)$('sticky').innerHTML=`<div class="p">${clp(p.price)}</div>${cta}`;
}

if(!slug){$('app').innerHTML='<div class="state">Producto no encontrado. <a href="/#catalogo">Ver catálogo</a></div>'}
else Promise.all([
  fetch('/api/product?slug='+encodeURIComponent(slug)).then(r=>r.ok?r.json():Promise.reject(r.status)),
  fetch('/api/config').then(r=>r.json()).catch(()=>({}))
]).then(([p,c])=>render(p,c)).catch(()=>{$('app').innerHTML='<div class="state">Este producto no está disponible. <a href="/#catalogo">Ver otros productos</a></div>'});
</script>
</body>
</html>
